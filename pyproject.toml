[project]
name = "prompt-injection-lab"
version = "0.1.0"
description = "A hands-on LangChain lab that reproduces prompt injection in a tool-using agent — and defends against it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "langserve>=0.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.30.0",
    "sse-starlette>=3.4.11",
]

[tool.uv]
package = false
